name: CTSMD pilot PHP safety checks
on:
  push:
    branches:
      - audit/board-pilot-readiness
    paths:
      - "src/**"
      - "tests/**"
      - "assets/css/ux-workspaces.css"
      - "assets/css/ux-member.css"
      - "assets/css/my-theatre.css"
      - "assets/js/ux-member.js"
      - "assets/css/ux-operational.css"
      - "assets/css/ux-operations.css"
      - "assets/css/operations-hub.css"
      - "assets/js/ux-operations.js"
      - "assets/js/production-people.js"
      - "assets/css/production-people.css"
      - "assets/js/unified-navigation.js"
      - "assets/js/account-menu.js"
      - "assets/css/navigation-controls.css"
      - "assets/css/home-experience.css"
      - "assets/css/public-home.css"
      - "assets/js/ux-workspaces.js"
      - ".github/workflows/pilot-php-safety.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "assets/css/ux-workspaces.css"
      - "assets/css/ux-member.css"
      - "assets/css/my-theatre.css"
      - "assets/js/ux-member.js"
      - "assets/css/ux-operational.css"
      - "assets/css/ux-operations.css"
      - "assets/css/operations-hub.css"
      - "assets/js/ux-operations.js"
      - "assets/js/production-people.js"
      - "assets/css/production-people.css"
      - "assets/js/unified-navigation.js"
      - "assets/js/account-menu.js"
      - "assets/css/navigation-controls.css"
      - "assets/css/home-experience.css"
      - "assets/css/public-home.css"
      - "assets/js/ux-workspaces.js"
      - ".github/workflows/pilot-php-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: none
      - name: Lint backend PHP
        run: |
          set -euo pipefail
          find src tests -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php -l front.php
      - name: Validate browser JavaScript
        run: |
          node --check assets/js/video-library-upload.js
          node --check assets/js/unified-navigation.js
          node --check assets/js/ux-workspaces.js
          node --check assets/js/account-menu.js
          node --check assets/js/ux-operations.js
          node --check assets/js/production-people.js
          node --check tests/ux_operations_browser.mjs
          node --check tests/ux_operations_interactions.mjs
          node --check tests/production_people_browser.mjs
          node --check tests/my_theatre_browser.mjs
          node --check tests/my_theatre_interactions.mjs
          node --check assets/js/ux-member.js
      - name: Staff production directory ordering and past grouping
        run: php tests/pilot_production_directory.php
      - name: Lifecycle write-boundary source contract
        run: php tests/pilot_lifecycle_write_boundaries.php
      - name: Participant eligibility birthday and category boundaries
        run: php tests/adult_participation.php
      - name: Closed-production roster write guards
        run: php tests/pilot_closed_production_roster.php
      - name: Closed-production form write guards
        run: php tests/pilot_closed_forms.php
      - name: Member roster aggregation and cross-production videos
        run: php tests/pilot_member_roster_media.php
      - name: Named video links in Community posts
        run: php tests/pilot_community_video_links.php
      - name: UX Action Center viewer and lifecycle boundaries
        run: |
          php tests/ux_action_visibility.php
          php tests/ux_operational_presentation.php
          php tests/ux_operations_contract.php
          php tests/navigation_controls.php
          php tests/homepage_presentation.php
      - name: Community search and safeguarding presentation regressions
        run: |
          php tests/community_search.php
          php tests/safeguarding_conversation_review.php
      - name: Video Library permissions and storage-path regression
        run: php tests/pilot_video_privacy.php
      - name: Isolated pilot regressions (no database/network)
        run: |
          set -euo pipefail
          php tests/pilot_lifecycle.php
          php tests/pilot_rate_limit.php
          php tests/pilot_volunteer_cancellation.php
