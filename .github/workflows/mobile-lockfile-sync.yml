name: Sync Expo dependency lockfile (one-time)
on:
  push:
    branches:
      - audit/board-pilot-readiness
    paths:
      - ".github/workflows/mobile-lockfile-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/board-pilot-readiness
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate exact Expo npm lockfile without scripts
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean dependency install and TypeScript
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npx expo install --check
      - name: Commit only package lockfile to existing branch
        run: |
          if git diff --quiet -- mobile/package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          git commit -m "Sync Expo 58 video dependency lockfile"
          git push origin HEAD:audit/board-pilot-readiness
